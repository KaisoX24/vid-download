[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vid-download"
version = "0.2.2"
description = "Download video/audio from the terminal via yt-dlp, with parallel batch downloads and progress bars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Pramit Acharjya", email = "acharjyapramit@gmail.com" }
]

keywords = ["youtube", "download", "yt-dlp", "cli", "video", "audio"]

classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "dotenv>=0.9.9",
    "typer>=0.27.1",
    "yt-dlp[default]>=2026.8.19",
]

[project.urls]
Homepage = "https://pypi.org/project/vid-download/"
Repository = "https://github.com/KaisoX24/vid-download"

[project.scripts]
vid-download = "vid_download.cli:app"

[tool.setuptools.packages.find]
include = ["vid_download*"]
